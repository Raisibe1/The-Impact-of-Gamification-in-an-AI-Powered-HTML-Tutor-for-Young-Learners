<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile — Web Dev Quest</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='dashboard.css') }}">
</head>
<body>
    <div id="app">

        <!-- ===== HEADER ===== -->
        <header class="site-header">
            <a class="brand" href="/">
                <svg class="brand-mark" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
                    <defs>
                        <linearGradient id="markGrad" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#667eea" />
                            <stop offset="1" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                    <rect x="1" y="1" width="32" height="32" rx="10" stroke="url(#markGrad)" stroke-width="1.4" opacity="0.5" />
                    <path d="M14 11 L9 17 L14 23" stroke="url(#markGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M20 11 L25 17 L20 23" stroke="url(#markGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="brand-text">
                    <span class="brand-name">Web Dev Quest</span>
                    <span class="brand-sub">Edit Profile</span>
                </span>
            </a>
            <div class="header-actions">
                <a class="login-btn ghost" href="/profile">Cancel</a>
            </div>
        </header>

        <!-- ===== MAIN ===== -->
        <main class="dash-main">
            <section class="panel">
                <div class="panel-head">
                    <h2>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8" />
                            <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        </svg>
                        Edit your profile
                    </h2>
                    <span class="muted">Update your details below.</span>
                </div>

                {% if error %}
                    <div class="gamification-feedback error" role="alert">
                        <div class="feedback-title">Could not save</div>
                        <div class="feedback-detail">{{ error }}</div>
                    </div>
                {% endif %}

                <form method="post" action="/me/edit" class="profile-form">

                    <div class="form-grid">
                        <div class="field">
                            <label for="name">First name</label>
                            <input id="name" name="name" type="text" required
                                   value="{{ student.name }}" maxlength="60">
                        </div>

                        <div class="field">
                            <label for="surname">Last name</label>
                            <input id="surname" name="surname" type="text" required
                                   value="{{ student.surname }}" maxlength="60">
                        </div>

                        <div class="field">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" required
                                   value="{{ student.email }}" maxlength="120">
                        </div>

                        <div class="field">
                            <label for="school">School</label>
                            <input id="school" name="school" type="text" required
                                   value="{{ student.school }}" maxlength="120">
                        </div>

                        <div class="field">
                            <label for="age_group">Age group</label>
                            <select id="age_group" name="age_group">
                                <option value="">Prefer not to say</option>
                                {% for opt in ["Under 10", "10–12", "13–15", "16–18", "18+"] %}
                                    <option value="{{ opt }}" {% if student.age_group == opt %}selected{% endif %}>{{ opt }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="field">
                            <label for="learning_style">Learning style</label>
                            <select id="learning_style" name="learning_style">
                                <option value="">Not sure yet</option>
                                {% for opt in ["Visual", "Auditory", "Reading", "Kinesthetic", "Mixed"] %}
                                    <option value="{{ opt }}" {% if student.learning_style == opt %}selected{% endif %}>{{ opt }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="field field-full">
                            <label for="goal">Learning goal</label>
                            <textarea id="goal" name="goal" rows="3" required maxlength="300">{{ student.goal }}</textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a class="btn btn-secondary" href="/profile">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <p>Powered by <a href="https://makecode.com" target="_blank" rel="noopener">Microsoft MakeCode</a></p>
        </footer>
    </div>
</body>
</html>
